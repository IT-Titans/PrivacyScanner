name: PR title

# Pull requests are squash-merged and the title becomes the commit subject on main.
# The release notes are built from those subjects, so the title is checked here,
# where it can still be edited, and not after it has become history.
#
# "edited" is in the list so that correcting the title re-runs the check.

on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    # No checkout and no third-party action: the job needs nothing but the title.
    # The title reaches the script through an environment variable. Writing the
    # expression into the script text would let a crafted title run as shell code.
    - name: Check that the title is a Conventional Commit
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
        pattern="^(${types})(\([a-z0-9][a-z0-9./_-]*\))?!?: [^[:space:]].*$"

        if [[ "$PR_TITLE" =~ $pattern ]]; then
          echo "ok: $PR_TITLE"
          exit 0
        fi

        echo "::error title=PR title::The title is not a Conventional Commit. Expected '<type>(<optional scope>): <summary>' with a type from: ${types//|/, }."
        echo "Title:    $PR_TITLE"
        echo "Examples: fix: skip files that cannot be read"
        echo "          feat(scanner)!: read UTF-16 files"
        exit 1
