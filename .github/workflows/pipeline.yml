name: CI/CD Pipeline
run-name: 1.0.0.${{ github.run_number }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The token may read the repository and nothing else. No job in this workflow writes
# to it, and a job that ever needs more asks for it itself.
permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless. Runs on main
# are never cancelled, so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0 # required for NBGV
        persist-credentials: false # no later step pushes; keep the token out of .git/config

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.0.x'

    - name: Check Codestyle (dotnet format)
      run: dotnet format --verify-no-changes --verbosity diagnostic

    # nbgv and ReportGenerator come from .config/dotnet-tools.json, at the versions
    # recorded there, instead of whatever is newest on the day of the run.
    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Set Version via NBGV
      id: nbgv
      run: dotnet nbgv cloud

    - name: Compute Version with Build
      shell: bash
      run: |
        echo "VERSION_WITH_BUILD=${NBGV_SimpleVersion}.${{ github.run_number }}" >> $GITHUB_ENV
        echo "::notice::Build Version is ${NBGV_SimpleVersion}.${{ github.run_number }}"

    - name: Update Directory.Build.props Version
      run: |
        $version = "$env:NBGV_SimpleVersion.${{ github.run_number }}"
        $path = "Directory.Build.props"
        $xml = [xml](Get-Content $path)
        $xml.Project.PropertyGroup.Version = $version
        $xml.Save($path)
        echo "Updated $path version to $version"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=true

    # One run over the whole solution, so a test project added later is picked up
    # without anyone remembering to add a line here. coverage.runsettings keeps the
    # local figure and this one comparable.
    - name: Run Unit Tests
      run: dotnet test PrivacyScanner.sln --configuration Release --no-build --settings coverage.runsettings --logger "trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Upload Test Results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results
        path: ./TestResults/*.trx
      if: always()

    # Every test project writes its own report and the reports overlap. ReportGenerator
    # merges them: a line counts as covered if any test project reaches it. The merged
    # Cobertura.xml is what the coverage job below checks.
    - name: Generate Coverage Report
      run: |
        dotnet reportgenerator "-reports:./TestResults/**/coverage.cobertura.xml" "-targetdir:./CoverageReport" "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"
        Get-Content ./CoverageReport/SummaryGithub.md | Add-Content $env:GITHUB_STEP_SUMMARY

    - name: Upload Coverage Report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-report
        path: ./CoverageReport
      if: always()

    - name: Upload Merged Cobertura Report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-cobertura
        path: ./CoverageReport/Cobertura.xml
        if-no-files-found: error

    - name: Publish UI Application
      run: dotnet publish PrivacyScanner.UI\PrivacyScanner.UI.csproj /p:PublishProfile=OneExe

    - name: Prepare Artifact
      run: |
        New-Item -ItemType Directory -Force -Path ./Artifact
        Copy-Item "PrivacyScanner.UI\bin\Publish\ITTitans.PrivacyScanner.UI.exe" -Destination "./Artifact/Privacy Scanner.exe"
        Copy-Item "install.md" -Destination "./Artifact/install.md"

    - name: Upload Published Executable
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Privacy Scanner ${{ env.VERSION_WITH_BUILD }}
        path: ./Artifact/

  # The coverage gate is its own job, and with it its own check, on purpose.
  #
  # "build" answers whether the change compiles, is formatted and passes its tests.
  # "coverage" answers whether the repository meets the 90 % rule, for the total and
  # for every assembly. As long as the code base is below 90 %, this job is red on
  # every run. That is the true state and it stays visible, while "build" remains
  # usable as a required check. Once main passes this job, add "coverage" to the
  # required checks of the branch ruleset.
  coverage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        sparse-checkout: scripts

    - name: Download Merged Cobertura Report
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: coverage-cobertura
        path: ./CoverageReport

    # A gate that has never been seen failing is an assumption. This runs the gate
    # against small reports with a known outcome before it is trusted with the real one.
    - name: Verify that the gate can fail
      shell: pwsh
      run: ./scripts/Test-CoverageGate.ps1

    # The four production assemblies are named so that one which drops out of the
    # report fails the check instead of disappearing from it. A new production project
    # belongs on this list in the commit that adds it.
    - name: Check Line Coverage (90 % total and per assembly)
      shell: pwsh
      run: >
        ./scripts/Check-Coverage.ps1
        -ReportPath ./CoverageReport/Cobertura.xml
        -Minimum 90
        -RequiredAssembly 'ITTitans.PrivacyScanner.Infrastructure,ITTitans.PrivacyScanner.Infrastructure.Contracts,ITTitans.PrivacyScanner.Model,ITTitans.PrivacyScanner.UI'
