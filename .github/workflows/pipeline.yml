name: CI/CD Pipeline
run-name: 1.0.0.${{ github.run_number }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The token may read the repository and nothing else. No job in this workflow writes
# to it, and a job that ever needs more asks for it itself.
permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless. Runs on main
# are never cancelled, so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0 # required for NBGV
        persist-credentials: false # no later step pushes; keep the token out of .git/config

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.0.x'

    - name: Check Codestyle (dotnet format)
      run: dotnet format --verify-no-changes --verbosity diagnostic

    # nbgv and ReportGenerator come from .config/dotnet-tools.json, at the versions
    # recorded there, instead of whatever is newest on the day of the run.
    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Set Version via NBGV
      id: nbgv
      run: dotnet nbgv cloud

    - name: Compute Version with Build
      shell: bash
      run: |
        echo "VERSION_WITH_BUILD=${NBGV_SimpleVersion}.${{ github.run_number }}" >> $GITHUB_ENV
        echo "::notice::Build Version is ${NBGV_SimpleVersion}.${{ github.run_number }}"

    - name: Update Directory.Build.props Version
      run: |
        $version = "$env:NBGV_SimpleVersion.${{ github.run_number }}"
        $path = "Directory.Build.props"
        $xml = [xml](Get-Content $path)
        $xml.Project.PropertyGroup.Version = $version
        $xml.Save($path)
        echo "Updated $path version to $version"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=true

    # One run over the whole solution, so a test project added later is picked up
    # without anyone remembering to add a line here. coverage.runsettings keeps the
    # local figure and this one comparable.
    - name: Run Unit Tests
      run: dotnet test PrivacyScanner.sln --configuration Release --no-build --settings coverage.runsettings --logger "trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Upload Test Results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results
        path: ./TestResults/*.trx
      if: always()

    - name: Generate Coverage Report
      run: dotnet reportgenerator -reports:./TestResults/**/coverage.cobertura.xml -targetdir:./CoverageReport -reporttypes:Html

    - name: Upload Coverage Report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-report
        path: ./CoverageReport
      if: always()

    - name: Publish UI Application
      run: dotnet publish PrivacyScanner.UI\PrivacyScanner.UI.csproj /p:PublishProfile=OneExe

    - name: Prepare Artifact
      run: |
        New-Item -ItemType Directory -Force -Path ./Artifact
        Copy-Item "PrivacyScanner.UI\bin\Publish\ITTitans.PrivacyScanner.UI.exe" -Destination "./Artifact/Privacy Scanner.exe"
        Copy-Item "install.md" -Destination "./Artifact/install.md"

    - name: Upload Published Executable
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Privacy Scanner ${{ env.VERSION_WITH_BUILD }}
        path: ./Artifact/
